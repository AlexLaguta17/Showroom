services:
  postgres:
    image: postgres:17.5
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./env/.env
    networks:
      - car_showroom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: CarShowroom
    container_name: backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./env/.env
    volumes:
      - ./CarShowroom:/app
      - static_files:/static
    command: bash -c "python manage.py migrate && python manage.py collectstatic --no-input && gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    networks:
      - car_showroom_network

  nginx:
    build: ./nginx
    container_name: nginx
    restart: unless-stopped
    volumes:
      - static_files:/static
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - car_showroom_network


volumes:
  postgres_data:
  static_files:

networks:
  car_showroom_network:
    driver: bridge
